
name: Build ReelGuard APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q ReelGuard-Android-Updated.zip -d project
          find project -name settings.gradle.kts

      - name: Build APK
        run: |
          ROOT=$(dirname "$(find project -name settings.gradle.kts -print -quit)")
          cd "$ROOT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ReelGuard-debug-apk
          path: project/**/build/outputs/apk/debug/*.apk
